# Auth gateway prototype. Deploy: cd auth && npx wrangler deploy
name = "agentic-auth"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://angrave.github.io,http://localhost:8000,http://127.0.0.1:8000"
SESSION_TTL = "28800"
UPSTREAM = "https://lumen.ncsa.illinois.edu/v1"
# Real providers: uncomment/fill in after registering clients (see ../auth-howto.md).
# Callback URL to register with each provider: https://agentic-auth.<subdomain>.workers.dev/auth/callback
PROVIDERS = '''
{
}
'''
